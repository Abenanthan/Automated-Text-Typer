<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
body { width:380px; margin:0; padding:14px; box-sizing:border-box; font-family:Segoe UI,Arial,sans-serif; }
h3 { margin:0 0 10px; }
textarea { width:100%; height:180px; box-sizing:border-box; resize:vertical; font:12px Consolas,monospace; }
.row { display:flex; gap:8px; margin-top:10px; }
button { flex:1; padding:9px; cursor:pointer; }
#status { margin-top:9px; font-size:12px; color:#555; }
small { color:#777; display:block; margin-top:6px; }
</style>
</head>
<body>
<h3>Code Writer</h3>
<label>Target file</label>
<select id="file" style="width:100%;padding:8px;margin:5px 0 8px">
  <option>index.html</option>
  <option>script.js</option>
  <option>style.css</option>
  <option>README.md</option>
</select>
<textarea id="code" placeholder="Enter the exact code to write..."></textarea>
<div class="row">
  <button id="write">Write Code</button>
  <button id="clear">Clear</button>
</div>
<div id="status"></div>
<small>Practice IDE only: targets localhost/127.0.0.1.</small>
<script src="popup.js"></script>
</body>
</html>
