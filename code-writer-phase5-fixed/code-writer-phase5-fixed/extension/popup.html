<!doctype html><html><head><meta charset="utf-8"><style>
body{width:390px;padding:14px;box-sizing:border-box;font-family:Arial}
textarea{width:100%;height:160px;box-sizing:border-box;font:12px Consolas,monospace}
select,button{width:100%;padding:8px;margin-top:8px}
#detect,#status{font-size:12px;margin-top:8px;white-space:pre-wrap}
</style></head><body>
<h3>Universal Code Writer</h3>
<select id="file"><option>index.html</option><option>script.js</option><option>style.css</option></select>
<textarea id="code" placeholder="Enter code..."></textarea>
<div id="detect">Detecting...</div>
<button id="write">Write Code</button><button id="clear">Clear</button>
<div id="status"></div>
<script src="popup.js"></script></body></html>
