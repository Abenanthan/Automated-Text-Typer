<!doctype html>
<html>
<head><meta charset="utf-8">
<style>
body{width:400px;margin:0;padding:14px;box-sizing:border-box;font-family:Segoe UI,Arial,sans-serif}
h3{margin:0 0 8px}.hint{font-size:12px;color:#777;margin-bottom:10px}
input[type=file]{width:100%;box-sizing:border-box}
button{width:100%;padding:9px;margin-top:10px;cursor:pointer}
#files{max-height:130px;overflow:auto;margin-top:9px;font-size:12px}
.item{padding:3px 0}.ok{color:#198754}.bad{color:#b42318}
#status{margin-top:10px;font-size:12px;white-space:pre-wrap}
</style></head>
<body>
<h3>Project Writer</h3>
<div class="hint">Choose a project folder. The files will be written to the local practice IDE.</div>
<input id="folder" type="file" webkitdirectory directory multiple>
<div id="files"></div>
<button id="write" disabled>Write Project</button>
<div id="status">No project selected.</div>
<script src="popup.js"></script>
</body></html>
